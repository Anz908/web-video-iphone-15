<style>
:root{
  --mint:#3fe8a4;--mint2:#1fae74;
  --glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.05);
  --border:rgba(180,255,220,.16);
  --dim:#9fb8ab;--text:#f2fff8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#020604;color:var(--text);font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh;max-width:460px;margin:0 auto;width:100%;position:relative}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;z-index:5}
.brand{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.2px}
.brand span{color:var(--mint)}
.top-icons{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--glass);color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.15s}
.icon-btn.on{background:linear-gradient(135deg,var(--mint),var(--mint2));color:#03210f;border-color:transparent;
  box-shadow:0 0 0 1px var(--mint),0 4px 16px rgba(63,232,164,.4)}

.tap-hint{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14.5px;color:#03210f;
  background:linear-gradient(135deg,var(--mint),var(--mint2));border-radius:999px;padding:13px 30px;
  display:inline-block;box-shadow:0 6px 22px rgba(63,232,164,.4)}
.retake{position:absolute;top:12px;left:12px;z-index:3;width:32px;height:32px;border-radius:50%;
  background:rgba(2,10,6,.55);border:1px solid var(--border);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.status-pill{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;
  background:rgba(2,10,6,.65);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--dim);white-space:nowrap;max-width:88%;
  overflow:hidden;text-overflow:ellipsis}
.status-pill.show{color:#dfffef}
progress{position:absolute;bottom:0;left:0;width:100%;height:3px;accent-color:var(--mint);z-index:3;
  -webkit-appearance:none;appearance:none;border:none}
progress::-webkit-progress-bar{background:rgba(255,255,255,.1)}
progress::-webkit-progress-value{background:var(--mint)}

/* mode strip */
.mode-strip-wrap{padding:12px 0 4px}
.mode-strip{display:flex;gap:22px;overflow-x:auto;padding:2px 24px;scrollbar-width:none}
.mode-strip::-webkit-scrollbar{display:none}
.mode-item{flex:none;font-family:'Quicksand',sans-serif;font-weight:600;font-size:13px;color:var(--dim);
  padding:4px 2px;cursor:pointer;white-space:nowrap;transition:.15s;text-align:center}
.mode-item .b{display:block;font-size:9.5px;font-weight:500;opacity:.75;margin-top:1px}
.mode-item.active{color:var(--mint);font-size:14.5px;transform:scale(1.05)}
.lens-row{display:flex;gap:8px;justify-content:center;padding:8px 0 2px}
.lens-chip{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--glass2);
  color:var(--dim);font-family:'Quicksand',sans-serif;font-weight:700;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.lens-chip.active{background:linear-gradient(135deg,var(--mint),var(--mint2));color:#03210f;border-color:transparent}

/* bottom bar */
.bottom-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 30px 22px}
.thumb-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--glass);
  font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.thumb-btn img{width:100%;height:100%;object-fit:cover}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:transparent;
  padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.shutter-inner{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--mint2));
  box-shadow:0 4px 18px rgba(63,232,164,.5)}
.shutter:active .shutter-inner{transform:scale(.88)}
.shutter-inner{transition:.12s}
.shutter[disabled]{opacity:.5;pointer-events:none}
.hd-cycle{width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--glass);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:1px}
.hd-cycle .l{font-family:'Quicksand',sans-serif;font-weight:700;font-size:9.5px;color:var(--mint)}
.hd-cycle .v{font-size:8px;color:var(--dim);max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* result sheet */
.result-sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(4,16,10,.88);
  backdrop-filter:blur(18px);border-top:1px solid var(--border);border-radius:22px 22px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.28s ease}
.result-sheet.open{transform:translateY(0)}
.result-sheet h2{font-family:'Quicksand',sans-serif;font-size:14.5px;margin:0 0 10px;color:var(--dim);font-weight:600}
.result-row{display:flex;gap:12px}
.dl-btn{flex:1;font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;border:none;cursor:pointer;
  border-radius:999px;padding:13px;color:#03210f;text-align:center;text-decoration:none;
  background:linear-gradient(135deg,var(--mint),var(--mint2))}
.close-sheet{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--border);
  background:var(--glass2);color:var(--dim);font-size:15px;cursor:pointer}
.hidden{display:none!important}
input[type=file]{display:none}
.empty-bar{padding:8px 24px calc(20px + env(safe-area-inset-bottom))}
.gallery-cta{width:100%;font-family:'Quicksand',sans-serif;font-weight:700;font-size:15px;border:none;cursor:pointer;
  border-radius:999px;padding:16px;color:#03210f;background:linear-gradient(135deg,var(--mint),var(--mint2));
  box-shadow:0 6px 22px rgba(63,232,164,.4)}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">HD IN <span>FOTO</span> & VIDEO</div>
    <div class="top-icons" id="topIcons">
      <button class="icon-btn" id="stabIconBtn" title="Mode Stabilkan">🫳</button>
      <button class="icon-btn" id="hdrIconBtn" title="Mode HDR">HDR</button>
    </div>
  </div>

  <div class="viewfinder" id="dropzone">
    <button class="retake hidden" id="retakeBtn">✕</button>
    <div class="viewfinder-inner">
      <div id="uploadPrompt">
        <div class="icon">🖼️</div>
        <h3>Belum ada foto/video</h3>
        <p>Pilih dari galeri kamu untuk mulai</p>
        <span class="tap-hint">Pilih dari Galeri</span>
      </div>
      <video id="previewVideo" controls muted playsinline class="hidden"></video>
      <img id="previewImg" class="hidden">
      <video id="resultVideo" controls class="hidden"></video>
      <img id="resultImg" class="hidden">
    </div>
    <div class="status-pill hidden" id="status"></div>
    <progress id="progressBar" class="hidden" max="100" value="0"></progress>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*">

  <div class="mode-strip-wrap hidden" id="modeStripWrap">
    <div class="mode-strip" id="modeStrip"></div>
    <div class="lens-row hidden" id="lensRow"></div>
  </div>

  <div class="bottom-bar hidden" id="bottomBar">
    <button class="thumb-btn" id="pickBtn">🖼️</button>
    <button class="shutter" id="processBtn"><span class="shutter-inner"></span></button>
    <button class="hd-cycle" id="hdCycleBtn"><span class="l">HD</span><span class="v" id="hdCycleLabel">Off</span></button>
  </div>

  <div class="empty-bar" id="emptyBar">
    <button class="gallery-cta" id="galleryCtaBtn">🖼️ Pilih dari Galeri</button>
  </div>

  <div class="result-sheet" id="resultSheet">
    <h2>Hasil</h2>
    <div class="result-row">
      <a class="dl-btn" id="downloadLink" download>Unduh Hasil</a>
      <button class="close-sheet" id="closeSheet">✕</button>
    </div>
  </div>
</div>

<script>
const RES = [
  {k:'1080p60',a:'1080p',b:'60fps',w:1920,h:1080,fps:60},
  {k:'1080p120',a:'1080p',b:'120fps',w:1920,h:1080,fps:120},
  {k:'2k60',a:'2K',b:'60fps',w:2560,h:1440,fps:60},
  {k:'2k120',a:'2K',b:'120fps',w:2560,h:1440,fps:120},
  {k:'4k60',a:'4K',b:'60fps',w:3840,h:2160,fps:60},
  {k:'4k120',a:'4K',b:'120fps',w:3840,h:2160,fps:120},
  {k:'8k60',a:'8K',b:'60fps',w:7680,h:4320,fps:60},
];
const HD_LEVELS = [
  {k:'off',l:'Off'},{k:'hd',l:'HD'},{k:'banget',l:'HD Banget'},{k:'iphone',l:'HD iPhone 15'}
];
const HD_FILTERS = {
  off:'none',
  hd:'contrast(1.12) saturate(1.18) brightness(1.03)',
  banget:'contrast(1.32) saturate(1.45) brightness(1.06)',
  iphone:'contrast(1.2) saturate(1.3) brightness(1.05) hue-rotate(-2deg)'
};
const SHARPEN_AMOUNT = {off:0, hd:0.35, banget:0.9, iphone:0.6};
const HDR_FILTER = 'contrast(1.22) saturate(1.4) brightness(1.08)';
const LENS_SCALES = [0.5, 1, 1.5, 2, 3];

let state = {mode:RES[0], stabilize:false, hdVideo:'off', hdrPhoto:false, hdPhoto:'off', photoScale:1, fileType:null, fileURL:null};

const $ = id => document.getElementById(id);
const dropzone=$('dropzone'), fileInput=$('fileInput'), pickBtn=$('pickBtn'), retakeBtn=$('retakeBtn');
const previewVideo=$('previewVideo'), previewImg=$('previewImg');
const statusEl=$('status'), progressBar=$('progressBar');
const resultVideo=$('resultVideo'), resultImg=$('resultImg'), downloadLink=$('downloadLink');
const resultSheet=$('resultSheet'), closeSheet=$('closeSheet');
const stabIconBtn=$('stabIconBtn'), hdrIconBtn=$('hdrIconBtn'), hdCycleBtn=$('hdCycleBtn'), hdCycleLabel=$('hdCycleLabel');
const modeStrip=$('modeStrip'), processBtn=$('processBtn'), lensRow=$('lensRow');
const modeStripWrap=$('modeStripWrap'), bottomBar=$('bottomBar'), emptyBar=$('emptyBar'), galleryCtaBtn=$('galleryCtaBtn');

function updateLivePreview(){
  if(state.fileType==='video'){
    previewVideo.style.filter = HD_FILTERS[state.hdVideo];
  } else if(state.fileType==='image'){
    const f=[HD_FILTERS[state.hdPhoto], state.hdrPhoto?HDR_FILTER:''].filter(x=>x&&x!=='none').join(' ')||'none';
    previewImg.style.filter = f;
  }
}
function renderModeStrip(){
  modeStrip.innerHTML='';
  const items = state.fileType==='video' ? RES : HD_LEVELS;
  const activeKey = state.fileType==='video' ? state.mode.k : state.hdPhoto;
  items.forEach(it=>{
    const el=document.createElement('div');
    el.className='mode-item'+(it.k===activeKey?' active':'');
    el.innerHTML = state.fileType==='video' ? `${it.a}<span class="b">${it.b}</span>` : it.l;
    el.onclick=()=>{
      if(state.fileType==='video') state.mode=it; else state.hdPhoto=it.k;
      renderModeStrip();
      updateLivePreview();
    };
    modeStrip.appendChild(el);
  });
  if(state.fileType==='image'){
    lensRow.classList.remove('hidden');
    lensRow.innerHTML='';
    LENS_SCALES.forEach(sc=>{
      const chip=document.createElement('div');
      chip.className='lens-chip'+(sc===state.photoScale?' active':'');
      chip.textContent = sc<1 ? sc.toString().replace('0.','.') : sc+'x';
      chip.onclick=()=>{ state.photoScale=sc; renderModeStrip(); };
      lensRow.appendChild(chip);
    });
  } else {
    lensRow.classList.add('hidden');
  }
  updateLivePreview();
}
function refreshTopIcons(){
  if(state.fileType==='video'){
    stabIconBtn.classList.remove('hidden'); hdrIconBtn.classList.add('hidden');
    stabIconBtn.classList.toggle('on', state.stabilize);
  } else if(state.fileType==='image'){
    hdrIconBtn.classList.remove('hidden'); stabIconBtn.classList.add('hidden');
    hdrIconBtn.classList.toggle('on', state.hdrPhoto);
  } else {
    stabIconBtn.classList.add('hidden'); hdrIconBtn.classList.add('hidden');
  }
}
function refreshHdCycle(){
  if(state.fileType==='video'){
    hdCycleBtn.classList.remove('hidden');
    hdCycleLabel.textContent = HD_LEVELS.find(x=>x.k===state.hdVideo).l;
  } else {
    hdCycleBtn.classList.add('hidden');
  }
}
stabIconBtn.onclick=()=>{ state.stabilize=!state.stabilize; refreshTopIcons(); };
hdrIconBtn.onclick=()=>{ state.hdrPhoto=!state.hdrPhoto; refreshTopIcons(); updateLivePreview(); };
hdCycleBtn.onclick=()=>{
  const idx=HD_LEVELS.findIndex(x=>x.k===state.hdVideo);
  state.hdVideo = HD_LEVELS[(idx+1)%HD_LEVELS.length].k;
  refreshHdCycle();
  updateLivePreview();
};

pickBtn.onclick=()=>fileInput.click();
galleryCtaBtn.onclick=()=>fileInput.click();
dropzone.onclick=(e)=>{ if(!state.fileURL) fileInput.click(); };
fileInput.onchange=()=>{ if(fileInput.files[0]) handleFile(fileInput.files[0]); };
retakeBtn.onclick=(e)=>{ e.stopPropagation(); resetApp(); };
closeSheet.onclick=()=>resultSheet.classList.remove('open');

function resetApp(){
  state.fileURL=null; state.fileType=null;
  $('uploadPrompt').classList.remove('hidden');
  previewVideo.classList.add('hidden'); previewImg.classList.add('hidden');
  resultVideo.classList.add('hidden'); resultImg.classList.add('hidden');
  retakeBtn.classList.add('hidden');
  dropzone.classList.remove('has-file');
  modeStrip.innerHTML=''; refreshTopIcons(); refreshHdCycle();
  modeStripWrap.classList.add('hidden'); bottomBar.classList.add('hidden'); emptyBar.classList.remove('hidden');
  resultSheet.classList.remove('open');
  statusEl.classList.remove('show'); statusEl.textContent='';
  progressBar.classList.add('hidden');
  fileInput.value='';
}

function handleFile(file){
  state.fileURL = URL.createObjectURL(file);
  state.fileType = file.type.startsWith('video') ? 'video' : 'image';
  $('uploadPrompt').classList.add('hidden');
  resultVideo.classList.add('hidden'); resultImg.classList.add('hidden');
  resultSheet.classList.remove('open');
  retakeBtn.classList.remove('hidden');
  dropzone.classList.add('has-file');
  modeStripWrap.classList.remove('hidden'); bottomBar.classList.remove('hidden'); emptyBar.classList.add('hidden');
  statusEl.classList.remove('show'); statusEl.textContent='';
  if(state.fileType==='video'){
    previewVideo.src=state.fileURL; previewVideo.classList.remove('hidden'); previewImg.classList.add('hidden');
  } else {
    previewImg.src=state.fileURL; previewImg.classList.remove('hidden'); previewVideo.classList.add('hidden');
  }
  renderModeStrip(); refreshTopIcons(); refreshHdCycle();
}

processBtn.onclick=()=>{
  if(!state.fileURL) return;
  processBtn.disabled=true;
  resultSheet.classList.remove('open');
  if(state.fileType==='image') processPhoto(); else processVideo();
};

function setStatus(t){ statusEl.textContent=t; statusEl.classList.toggle('show', !!t); }

function sharpenCanvas(ctx, w, h, amount){
  if(amount<=0) return;
  const src=ctx.getImageData(0,0,w,h);
  const s=src.data;
  const out=ctx.createImageData(w,h);
  const o=out.data;
  const k=amount; // center weight boost; 4-neighbor unsharp
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      if(x===0||y===0||x===w-1||y===h-1){
        o[i]=s[i]; o[i+1]=s[i+1]; o[i+2]=s[i+2]; o[i+3]=s[i+3];
        continue;
      }
      const iu=i-w*4, id=i+w*4, il=i-4, ir=i+4;
      for(let c=0;c<3;c++){
        const center=s[i+c]*(1+4*k);
        const neigh=(s[iu+c]+s[id+c]+s[il+c]+s[ir+c])*k;
        o[i+c]=Math.min(255,Math.max(0, center-neigh));
      }
      o[i+3]=s[i+3];
    }
  }
  ctx.putImageData(out,0,0);
}

function processPhoto(){
  setStatus('Memproses foto...');
  const img=new Image();
  img.onload=()=>{
    const scale=state.photoScale;
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=canvas.getContext('2d');
    ctx.filter=[HD_FILTERS[state.hdPhoto], state.hdrPhoto?HDR_FILTER:''].filter(f=>f&&f!=='none').join(' ')||'none';
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const megapixels=(canvas.width*canvas.height)/1e6;
    const sharpenAmt = SHARPEN_AMOUNT[state.hdPhoto];
    if(sharpenAmt>0 && megapixels<=24){ ctx.filter='none'; sharpenCanvas(ctx, canvas.width, canvas.height, sharpenAmt); }
    canvas.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      previewImg.classList.add('hidden');
      resultImg.src=url; resultImg.classList.remove('hidden');
      downloadLink.href=url; downloadLink.download='hd-in-foto.png';
      resultSheet.classList.add('open');
      setStatus(''); processBtn.disabled=false;
    },'image/png');
  };
  img.src=state.fileURL;
}

// ---- Analisis gerakan (block-matching sederhana) untuk stabilisasi asli ----
function toGray(sctx, w, h){
  const d=sctx.getImageData(0,0,w,h).data;
  const g=new Uint8ClampedArray(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++) g[j]=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0;
  return g;
}
function estimateMotion(prev,curr,w,h,pw,ph,radius){
  const px0=Math.floor((w-pw)/2), py0=Math.floor((h-ph)/2);
  let bestSAD=Infinity, bestDx=0, bestDy=0;
  for(let dy=-radius; dy<=radius; dy++){
    const sy=py0+dy; if(sy<0||sy+ph>h) continue;
    for(let dx=-radius; dx<=radius; dx++){
      const sx=px0+dx; if(sx<0||sx+pw>w) continue;
      let sad=0;
      for(let yy=0; yy<ph; yy+=2){
        const rc=(py0+yy)*w+px0, rp=(sy+yy)*w+sx;
        for(let xx=0; xx<pw; xx+=2) sad+=Math.abs(curr[rc+xx]-prev[rp+xx]);
      }
      if(sad<bestSAD){ bestSAD=sad; bestDx=dx; bestDy=dy; }
    }
  }
  return {dx:bestDx, dy:bestDy};
}
function analyzeMotion(vid, onProgress){
  return new Promise(resolve=>{
    const SW=128, SH=Math.max(8, Math.round(128*vid.videoHeight/vid.videoWidth));
    const sc=document.createElement('canvas'); sc.width=SW; sc.height=SH;
    const sctx=sc.getContext('2d',{willReadFrequently:true});
    const pw=Math.round(SW*0.4), ph=Math.round(SH*0.4), radius=8;
    let prevGray=null, cumX=0, cumY=0;
    const traj=[];
    vid.currentTime=0; vid.muted=true;
    function step(){
      if(vid.paused||vid.ended){ resolve({traj, scaleX:vid.videoWidth/SW, scaleY:vid.videoHeight/SH}); return; }
      sctx.drawImage(vid,0,0,SW,SH);
      const gray=toGray(sctx,SW,SH);
      if(prevGray){
        const {dx,dy}=estimateMotion(prevGray,gray,SW,SH,pw,ph,radius);
        cumX+=dx; cumY+=dy;
      }
      traj.push({t:vid.currentTime, x:cumX, y:cumY});
      prevGray=gray;
      if(vid.duration) onProgress(vid.currentTime/vid.duration);
      requestAnimationFrame(step);
    }
    vid.onplay=()=>requestAnimationFrame(step);
    vid.play().catch(()=>resolve({traj:[], scaleX:1, scaleY:1}));
  });
}
function smoothTrajectory(traj){
  const WIN=0.35, n=traj.length, out=new Array(n);
  for(let i=0;i<n;i++){
    let sx=0,sy=0,c=0, ti=traj[i].t;
    for(let j=0;j<n;j++){ if(Math.abs(traj[j].t-ti)<=WIN){ sx+=traj[j].x; sy+=traj[j].y; c++; } }
    out[i]={t:ti, x:sx/c, y:sy/c};
  }
  return out;
}
function makeSampler(traj){
  let idx=0;
  return t=>{
    if(!traj.length) return {x:0,y:0};
    while(idx<traj.length-1 && traj[idx+1].t<=t) idx++;
    const a=traj[idx], b=traj[Math.min(idx+1,traj.length-1)];
    if(b.t===a.t) return {x:a.x,y:a.y};
    const f=Math.min(1,Math.max(0,(t-a.t)/(b.t-a.t)));
    return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f};
  };
}

async function processVideo(){
  const {w,h,fps}=state.mode;
  progressBar.classList.remove('hidden'); progressBar.value=0;

  const vid=document.createElement('video');
  vid.src=state.fileURL; vid.muted=true; vid.playsInline=true;
  await new Promise(res=>{ vid.onloadedmetadata=res; });

  let sampler=null, scaleX=1, scaleY=1;
  if(state.stabilize){
    setStatus('Menganalisis gerakan (tahap 1/2)...');
    const {traj, scaleX:sx2, scaleY:sy2} = await analyzeMotion(vid, p=>progressBar.value=p*45);
    scaleX=sx2; scaleY=sy2;
    sampler = makeSampler(smoothTrajectory(traj));
  }

  const canvas=document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.filter=HD_FILTERS[state.hdVideo];
  const marginRatio = state.stabilize ? 0.88 : 1;
  const cw=vid.videoWidth*marginRatio, ch=vid.videoHeight*marginRatio;
  const baseSx=(vid.videoWidth-cw)/2, baseSy=(vid.videoHeight-ch)/2;

  const canvasStream=canvas.captureStream(fps);
  try{
    const srcStream=vid.captureStream ? vid.captureStream() : null;
    if(srcStream) srcStream.getAudioTracks().forEach(t=>canvasStream.addTrack(t));
  }catch(e){}

  const mimeCandidates=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=mimeCandidates.find(m=>MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const bitrate=Math.min(40_000_000, Math.round(w*h*0.07));
  const recorder=new MediaRecorder(canvasStream,{mimeType:mime, videoBitsPerSecond:bitrate});
  const chunks=[];
  recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    const url=URL.createObjectURL(blob);
    previewVideo.classList.add('hidden');
    resultVideo.src=url; resultVideo.classList.remove('hidden');
    downloadLink.href=url; downloadLink.download='hd-in-video.webm';
    resultSheet.classList.add('open');
    progressBar.classList.add('hidden');
    setStatus(''); processBtn.disabled=false;
  };

  function drawFrame(){
    if(vid.paused || vid.ended){ if(recorder.state==='recording') recorder.stop(); return; }
    let sx=baseSx, sy=baseSy;
    if(sampler){
      const p=sampler(vid.currentTime);
      sx=baseSx+p.x*scaleX; sy=baseSy+p.y*scaleY;
      sx=Math.min(Math.max(sx,0), vid.videoWidth-cw);
      sy=Math.min(Math.max(sy,0), vid.videoHeight-ch);
    }
    ctx.drawImage(vid, sx, sy, cw, ch, 0, 0, canvas.width, canvas.height);
    if(vid.duration) progressBar.value = (state.stabilize?45:0) + (vid.currentTime/vid.duration)*(state.stabilize?55:100);
    requestAnimationFrame(drawFrame);
  }

  vid.currentTime=0;
  vid.onplay=()=>{ setStatus(state.stabilize?'Merender video stabil (tahap 2/2)...':'Memproses video...'); recorder.start(200); drawFrame(); };
  vid.onended=()=>{ if(recorder.state==='recording') recorder.stop(); };
  vid.play().catch(()=>{ setStatus('Gagal memutar video sumber.'); processBtn.disabled=false; });
}

resetApp();
</script>
